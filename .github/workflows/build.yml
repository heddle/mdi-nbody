name: Java build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out mdi-nbody
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Temporary: remove these two steps, and set mdi.version to the release,
      # once MDI 1.2.5 is on Maven Central.
      - name: Check out the MDI snapshot
        uses: actions/checkout@v4
        with:
          repository: heddle/mdi
          ref: 970ab0b4c53295d6d50c675ace75de06147b5294
          path: mdi-framework

      - name: Install the MDI snapshot
        run: mvn --batch-mode --no-transfer-progress -DskipTests -f mdi-framework/pom.xml install

      - name: Build and test mdi-nbody
        run: mvn --batch-mode --no-transfer-progress clean verify