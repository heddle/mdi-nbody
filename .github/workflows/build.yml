name: Java build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out mdi-nbody
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # MDI is a separately maintained dependency, not part of this repository.
      - name: Check out the compatible MDI revision
        uses: actions/checkout@v4
        with:
          repository: heddle/mdi
          ref: ea9823f8aceec7b827731f5fdbd55f4528200a42
          path: .build-deps/mdi
      - name: Install MDI dependency
        run: mvn --batch-mode --no-transfer-progress -f .build-deps/mdi/pom.xml -DskipTests -Dmaven.javadoc.skip=true install
      - name: Build and test mdi-nbody
        run: mvn --batch-mode --no-transfer-progress verify
